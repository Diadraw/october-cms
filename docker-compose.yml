services:
  app:
    build: .
    container_name: october-app
    restart: unless-stopped
    working_dir: /app
    # On production (Dokploy), we don't want to mount the local folder 
    # as it might overwrite the vendor folder we built in the Dockerfile
    # volumes:
    #   - ./:/app
    environment:
      - WEB_DOCUMENT_ROOT=/app
      - PHP_DISPLAY_ERRORS=1
      - PHP_MEMORY_LIMIT=512M
      - APP_KEY=${APP_KEY}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-october}
      - DB_USERNAME=${DB_USERNAME:-october}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - APP_URL=${APP_URL}
    ports:
      - "8087:80"
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: october-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: october
      MYSQL_USER: october
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  mailpit:
    image: axllent/mailpit
    container_name: october-mail
    restart: unless-stopped
    ports:
      - "8027:8025"
      - "1027:1025"

volumes:
  db_data:
